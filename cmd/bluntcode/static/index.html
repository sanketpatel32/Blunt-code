    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bluntcode-theme');

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#11141a' : '#ffffff');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
