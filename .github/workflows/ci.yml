name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: npm test -- --run

      - name: Web build (embedded assets)
        working-directory: web
        run: npm run build

      # Dogfood gate: the freshly built binary scans the repository itself.
      # An isolated LOCALAPPDATA keeps the run away from any real installation,
      # and the built-in analyzers cover the repo's Go sources without any
      # managed-tool downloads on the runner.
      - name: Build exe for self-scan
        run: go build -o bluntcode.exe ./cmd/bluntcode

      - name: Self-scan dogfood gate (Go sources)
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bluntcode-selfscan'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          .\bluntcode.exe scan cmd internal --profile quick --fail-on high+ --json --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload report when the gate trips
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-scan-report
          path: '**/report-*.md'
          if-no-files-found: ignore
