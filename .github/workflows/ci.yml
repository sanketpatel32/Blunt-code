# Continuous integration for Blunt Code.
#
# The app is Windows-first: data dirs resolve under LOCALAPPDATA, managed
# analyzers are windows-amd64 binaries, and several tests rely on
# Windows-specific behavior — so the whole pipeline runs on windows-latest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch (or a new commit on the same PR) cancels
# the now-outdated in-progress run instead of queueing a duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  build-test-scan:
    name: Build, test, and self-scan (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Take the exact toolchain from go.mod instead of maintaining a
          # second version pin here; module cache is keyed on go.sum.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Build
        shell: pwsh
        run: go build ./...

      # No -race: the suite has not been race-audited and the project is
      # built without cgo locally (modernc.org/sqlite), so CI stays
      # equivalent to local runs. The internal/database LargeVolume tests
      # take roughly two minutes; that is expected.
      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Vite 7 needs Node >= 20.19; "20" resolves to the latest 20.x
          # LTS patch, which satisfies that. No engines pin exists in
          # web/package.json.
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        shell: pwsh
        working-directory: web
        run: npm ci

      - name: Web tests
        shell: pwsh
        working-directory: web
        run: npm run test

      - name: Build web UI
        shell: pwsh
        working-directory: web
        run: npm run build

      # ---- Self-scan dogfood gate -----------------------------------------
      # The scanner scans its own web/ sources with the quick profile
      # (ruff + biome only; see internal/scans/exec.go). Missing managed
      # tools download into <LOCALAPPDATA>\BluntCode\tools on first use.
      # First-use downloads plus cache misses cost a few hundred MB of
      # network transfer across runs — acceptable for now — so cache the
      # exact tools directory. The cache key hashes the pinned tool
      # versions in internal/tools/manifest.json; tool installs live under
      # <tools>/<tool_id>/<version>/ and are self-contained, so an exact
      # match is always valid and no restore-keys fallback is needed.
      - name: Cache managed analyzer tools
        uses: actions/cache@v5
        with:
          path: .blunt-ci-appdata/BluntCode/tools
          key: blunt-managed-tools-${{ runner.os }}-${{ hashFiles('internal/tools/manifest.json') }}

      - name: Build scanner executable
        shell: pwsh
        run: go build -o bin/bluntcode.exe ./cmd/bluntcode

      # LOCALAPPDATA is redirected to a workspace-local throwaway directory
      # for this step only: config.DefaultPaths() derives the entire data
      # dir (DB, logs, temp, tools, reports) from it, so the self-scan can
      # never depend on — or pollute — a real user profile or another
      # step's state. --fail-on high+ makes the step exit 1 (and fail CI)
      # when high or critical findings land in web/.
      - name: Self-scan web/ (quick profile, fail on high+)
        shell: pwsh
        env:
          LOCALAPPDATA: '${{ github.workspace }}\.blunt-ci-appdata'
        run: .\bin\bluntcode.exe scan web --profile quick --fail-on high+ --quiet

      # Every scan writes one markdown report to
      # <LOCALAPPDATA>\BluntCode\reports\blunt-code-<workspace>-<timestamp>.md.
      # !cancelled() keeps the upload when the gate trips — that is exactly
      # when someone needs the report to see which finding failed the build.
      # if-no-files-found: error so a green run can never silently skip the
      # report writer.
      - name: Upload scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blunt-code-self-scan-report
          path: .blunt-ci-appdata/BluntCode/reports/blunt-code-*.md
          retention-days: 7
          if-no-files-found: error
