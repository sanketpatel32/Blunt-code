<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/bluntcode-mark.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>Blunt Code — Local code analysis</title>
    <!--
      No webfont requests: this is a local-first desktop app, so the UI never
      dials fonts.googleapis.com. The font stacks in tokens.css lead with
      "IBM Plex Sans"/"IBM Plex Mono" (used when installed locally) and fall
      back to system-ui/ui-monospace otherwise.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bluntcode-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#11141a' : '#ffffff');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
