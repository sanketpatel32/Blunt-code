rules:
  - id: blunt-code.python.eval
    languages: [python]
    severity: ERROR
    message: Avoid eval() on data that may be controlled outside this code path.
    metadata:
      category: security
    pattern: eval(...)
  - id: blunt-code.javascript.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid eval() on data that may be controlled outside this code path.
    metadata:
      category: security
    pattern: eval(...)
